# .github/workflows/ci.yml - Check every push and pull request: types, tests, build, the guided walkthroughs, and Terraform.

name: ci

# Every branch push, plus pull requests into main
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token; CI never writes to the repo
permissions:
  contents: read

jobs:
  # Full history, so a secret in any commit fails the run. The image is pinned by digest
  secrets:
    # A name no other workflow uses, so branch rules can require exactly this check
    name: ci-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - run: docker run --rm -v "$PWD:/src" -w /src ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact --no-banner .

  # Typecheck, test, and build the TypeScript workspaces
  app:
    # A name no other workflow uses, so branch rules can require exactly this check
    name: ci-app
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs; the checkout keeps no token
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 22, matching the Lambda runtime, with the npm cache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # One version everywhere: the changelog's top entry and package.json agree
      - name: Check the release number
        run: |
          top=$(sed -n 's/^## v\([0-9][0-9.]*[0-9a-z.-]*\).*/\1/p' CHANGELOG.md | head -1)
          pkg=$(node -p "require('./package.json').version")
          [ "$top" = "$pkg" ] || { echo "::error::CHANGELOG.md says v$top but package.json says $pkg"; exit 1; }
          echo "release v$top"

      # Exact lockfile install, then typecheck, tests, and production builds of API and web
      - run: npm ci
      - run: npm run check

  # Whether these exact inputs already passed the walkthroughs in CI (scripts/walkthroughs-proof.mjs): a release commit that
  # only moves the changelog, the API, the docs or the release number is the dev commit that passed, so it needn't play them
  # again. Any other difference, an error, or a changed live site runs the whole suite
  proof:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.proof.outputs.skip }}
      fingerprint: ${{ steps.proof.outputs.fingerprint }}
      site: ${{ steps.proof.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/walkthroughs-proof.mjs | tee -a "$GITHUB_OUTPUT"

  # Every guided walkthrough, played in a real browser on a desktop and a phone screen, has to reach
  # its end card. This is the check that catches a walkthrough stopping partway
  walkthrough-shard:
    needs: proof
    if: needs.proof.outputs.skip != 'true'
    name: walkthroughs (shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Playwright's own image carries Chromium and its system libraries, so no step installs them from the
    # Ubuntu mirror, which has stalled other jobs for 30 minutes. Its tag is the version in package-lock.json; change both together
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    # Each shard plays a third of the walkthroughs on its own machine, so the slowest third sets the time
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # Actions are pinned to commit SHAs; the checkout keeps no token
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # The web build; Chromium comes with the container image
      - run: npm ci
      - run: npm run build --workspace @1neon/web
      - run: npm run walkthroughs
        env:
          SHARD: ${{ matrix.shard }}/3

      # A failed run leaves a screenshot of where it stopped
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: walkthrough-failures-${{ matrix.shard }}
          path: walkthrough-failure-*.png
          if-no-files-found: ignore
          retention-days: 14

  # One result for the three shards, under the name branch rules and the release jobs already wait on
  walkthroughs:
    # A name no other workflow uses, so branch rules can require exactly this check
    name: ci-walkthroughs
    needs: [proof, walkthrough-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # The shards passed, or were skipped on a proof from an earlier run of the same inputs
      - run: |
          test "${{ needs.walkthrough-shard.result }}" = success || { test "${{ needs.walkthrough-shard.result }}" = skipped && test "${{ needs.proof.outputs.skip }}" = true; }
          printf '{"fingerprint":"%s","site":"%s"}\n' "${{ needs.proof.outputs.fingerprint }}" "${{ needs.proof.outputs.site }}" > walkthrough-proof.json
      # What a later run reads as proof; written only after the line above passed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: walkthrough-proof
          path: walkthrough-proof.json
          retention-days: 30

  # Terraform checks without touching AWS
  terraform:
    # A name no other workflow uses, so branch rules can require exactly this check
    name: ci-terraform
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs; the checkout keeps no token
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same Terraform version people use locally; no wrapper, so output stays plain
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      # Formatting and validation need no AWS access
      - run: terraform fmt -check -recursive -diff infra
      - run: terraform -chdir=infra/envs/prod init -backend=false -input=false
      - run: terraform -chdir=infra/envs/prod validate -no-color
